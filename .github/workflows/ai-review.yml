name: AI Review

on:
  pull_request:

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    # TODO: pin to @v1 once adobe/helix-shared-workflows#2 is released
    uses: adobe/helix-shared-workflows/.github/workflows/ai-review.yml@ai-review-workflow
    secrets:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    with:
      # writes junit.xml and lcov.info, which the reviewers get
      test: npm test
